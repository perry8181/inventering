<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EAN-scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1c1c24;
    --surface2: #252530;
    --accent: #6c63ff;
    --green: #22c55e;
    --red: #ef4444;
    --text: #f1f1f5;
    --muted: #8b8b9e;
    --border: #2e2e3a;
    --radius: 16px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px calc(env(safe-area-inset-bottom, 16px) + 16px);
    gap: 20px;
  }

  .header {
    padding: 20px 0 0;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── Camera ── */
  .camera-wrap {
    position: relative;
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
    aspect-ratio: 4/3;
    flex-shrink: 0;
  }

  #scan-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .scan-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80%; height: 32%;
    border: 2px solid rgba(108,99,255,0.85);
    border-radius: 8px;
  }

  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    animation: scanline 1.8s ease-in-out infinite;
    top: 50%;
  }

  @keyframes scanline {
    0%   { transform: translateY(-28px); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(28px); opacity: 0; }
  }

  .scan-hint {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    background: rgba(0,0,0,0.5);
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── Result box ── */
  .result-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.25s;
  }

  .result-box.has-code {
    border-color: var(--accent);
  }

  .result-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }

  .result-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .result-code {
    flex: 1;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    word-break: break-all;
  }

  .result-code.empty {
    font-size: 15px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0;
  }

  .btn-copy {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-copy:active { transform: scale(0.95); opacity: 0.85; }
  .btn-copy:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .btn-copy.copied {
    background: var(--green);
  }

  /* ── History ── */
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .btn-clear {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s;
  }

  .history-item:active { border-color: var(--accent); }

  .history-code {
    flex: 1;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }

  .history-time {
    font-size: 11px;
    color: var(--muted);
  }

  .history-copy-icon {
    font-size: 14px;
    color: var(--muted);
  }

  .empty-history {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 16px 0;
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    color: var(--text);
    padding: 11px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 999;
    border: 1px solid var(--border);
    white-space: nowrap;
    pointer-events: none;
  }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--green); color: var(--green); }
  #toast.error   { border-color: var(--red);   color: var(--red); }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <h1>EAN-scanner</h1>
    <p>Rikta kameran mot streckkoden</p>
  </div>

  <!-- Camera -->
  <div class="camera-wrap">
    <video id="scan-video" autoplay playsinline muted></video>
    <div class="scan-overlay">
      <div class="scan-frame">
        <div class="scan-line"></div>
      </div>
      <div class="scan-hint">Håll streckkoden inom rutan</div>
    </div>
  </div>

  <!-- Result -->
  <div class="result-box" id="result-box">
    <div class="result-label">Senast skannad</div>
    <div class="result-row">
      <span class="result-code empty" id="result-code">Väntar på skanning…</span>
      <button class="btn-copy" id="btn-copy" onclick="copyCode()" disabled>
        Kopiera
      </button>
    </div>
  </div>

  <!-- History -->
  <div>
    <div class="history-header">
      <span class="history-title">Historik</span>
      <button class="btn-clear" onclick="clearHistory()">Rensa</button>
    </div>
  </div>
  <div class="history-list" id="history-list">
    <div class="empty-history" id="empty-msg">Inga koder skannade ännu</div>
  </div>

</div>

<div id="toast"></div>

<script>
let scanActive   = false;
let scanStream   = null;
let quaggaActive = false;
let lastCode     = '';
let history      = JSON.parse(localStorage.getItem('ean_history') || '[]');

// ── Toast ──
function toast(msg, type = '', dur = 2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, dur);
}

// ── Copy ──
async function copyCode(code) {
  const val = code || lastCode;
  if (!val) return;
  try {
    await navigator.clipboard.writeText(val);
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ Kopierad';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Kopiera';
      btn.classList.remove('copied');
    }, 1800);
    toast('✓ ' + val + ' kopierad', 'success');
  } catch(e) {
    // Fallback for older iOS
    const ta = document.createElement('textarea');
    ta.value = val;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✓ Kopierad', 'success');
  }
}

// ── Result display ──
function showResult(code) {
  lastCode = code;
  const el   = document.getElementById('result-code');
  const box  = document.getElementById('result-box');
  const btn  = document.getElementById('btn-copy');

  el.textContent = code;
  el.classList.remove('empty');
  box.classList.add('has-code');
  btn.disabled = false;

  addToHistory(code);
}

// ── History ──
function addToHistory(code) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  // Avoid duplicates in a row
  if (history.length > 0 && history[0].code === code) return;
  history.unshift({ code, time });
  if (history.length > 50) history.pop();
  localStorage.setItem('ean_history', JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  history = [];
  localStorage.removeItem('ean_history');
  renderHistory();
}

function renderHistory() {
  const list  = document.getElementById('history-list');
  const empty = document.getElementById('empty-msg');

  if (history.length === 0) {
    list.innerHTML = '<div class="empty-history" id="empty-msg">Inga koder skannade ännu</div>';
    return;
  }

  list.innerHTML = history.map(item => `
    <div class="history-item" onclick="copyCode('${item.code}')">
      <span class="history-code">${item.code}</span>
      <span class="history-time">${item.time}</span>
      <span class="history-copy-icon">⎘</span>
    </div>
  `).join('');
}

// ── Scanner ──
function stopScanner() {
  scanActive = false;
  if (quaggaActive) {
    try { Quagga.stop(); } catch(e) {}
    quaggaActive = false;
  }
  if (scanStream) {
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
  const v = document.getElementById('scan-video');
  if (v) v.srcObject = null;
}

async function startScanner() {
  stopScanner();
  scanActive = true;

  if ('BarcodeDetector' in window) {
    await startNativeScanner();
  } else {
    startQuaggaScanner();
  }
}

async function startNativeScanner() {
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const video = document.getElementById('scan-video');
    video.srcObject = scanStream;
    await video.play();

    let detector;
    try {
      detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'] });
    } catch(e) {
      detector = new BarcodeDetector();
    }

    let cooldown = false;
    const loop = async () => {
      if (!scanActive) return;
      if (!cooldown && video.readyState >= 2) {
        try {
          const results = await detector.detect(video);
          if (results.length > 0) {
            cooldown = true;
            onDetected(results[0].rawValue);
            setTimeout(() => { cooldown = false; }, 2000);
          }
        } catch(e) {}
      }
      setTimeout(() => requestAnimationFrame(loop), 100);
    };
    requestAnimationFrame(loop);

  } catch(err) {
    console.warn('BarcodeDetector failed, using Quagga:', err);
    startQuaggaScanner();
  }
}

function startQuaggaScanner() {
  if (quaggaActive) return;

  Quagga.init({
    inputStream: {
      name: 'Live',
      type: 'LiveStream',
      target: document.getElementById('scan-video').parentElement,
      constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    },
    locator: { patchSize: 'medium', halfSample: true },
    numOfWorkers: 2,
    frequency: 10,
    decoder: {
      readers: ['ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_128_reader'],
      multiple: false,
    },
    locate: true,
  }, err => {
    if (err) {
      console.error('Quagga init:', err);
      toast('Kamerafel – kontrollera behörigheter', 'error', 4000);
      return;
    }
    Quagga.start();
    quaggaActive = true;
  });

  let lastQuaggaCode = '';
  let quaggaCooldown = false;
  Quagga.offDetected();
  Quagga.onDetected(result => {
    const code = result?.codeResult?.code;
    if (!code || code.length < 8 || quaggaCooldown) return;
    if (code === lastQuaggaCode) return;
    lastQuaggaCode = code;
    quaggaCooldown = true;
    setTimeout(() => { quaggaCooldown = false; lastQuaggaCode = ''; }, 2000);
    onDetected(code);
  });
}

function onDetected(code) {
  showResult(code);
  // Restart scanner after 2s so user can scan next item
  setTimeout(() => {
    if (scanActive) return; // already restarted
  }, 2100);
}

// ── Boot ──
window.addEventListener('DOMContentLoaded', () => {
  renderHistory();
  startScanner();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopScanner();
  } else {
    startScanner();
  }
});
</script>
</body>
</html>
